<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nomkin — a little creature that eats what you eat</title>
    <meta
      name="description"
      content="A calm, ADHD-friendly way to track what you eat and how much you move. Feed a pet instead of draining a number. Coming soon to iPhone and Android."
    />
    <link rel="canonical" href="https://nomkin.app/" />
    <meta name="theme-color" content="#ef9f27" />

    <link rel="icon" href="/assets/app-icon.png" />
    <link rel="apple-touch-icon" href="/assets/app-icon.png" />
    <link rel="stylesheet" href="/styles.css" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nomkin.app/" />
    <meta property="og:title" content="Nomkin" />
    <meta property="og:description" content="A little creature that eats what you eat." />
    <meta property="og:image" content="https://nomkin.app/assets/app-icon.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body class="wash">
    <!--
      Spec §6.1 step 1, on the web. The app's first screen supplies three things
      and stops — the name, one line saying what a Nomkin is, and the animal —
      and so does this. The only additions are the two things a landing page has
      to say that an app does not: it isn't out yet, and here is the policy.
    -->
    <main class="wash__main">
      <h1 class="wordmark">Nomkin</h1>
      <p class="tagline">A little creature that eats what you eat.</p>

      <!-- Decorative: the line above says everything this needs to say. -->
      <img class="pet" src="/assets/dog.png" alt="" width="1200" height="1200" />

      <p class="coming-soon">Coming soon</p>

      <ul class="stores">
        <li>
          <!--
          Recreations, not the official artwork, and deliberately not links.
          Both stores only permit their badge to point at a live listing, and
          there isn't one yet. Swap in the official SVGs and add the hrefs on
          launch day — see README.md.
        -->
          <svg
            class="badge"
            viewBox="0 0 135 40"
            role="img"
            aria-label="Coming soon to the Apple App Store"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="135" height="40" rx="7" fill="#000" />
            <rect x="0.5" y="0.5" width="134" height="39" rx="6.5" fill="none" stroke="#a6a6a6" />
            <path
              fill="#fff"
              d="M25.6 20.3c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.2 1.2-2.4 1.3-2.5-.1 0-2.5-1-2.5-3.7zm-2.3-6.8c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.8 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.8-1.3z"
            />
            <!-- `textLength` pins the width so the badge is the same shape on a
               machine that has none of these fonts. -->
            <text
              x="41"
              y="16.5"
              fill="#fff"
              font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="8"
              textLength="70"
              lengthAdjust="spacingAndGlyphs"
            >
              Coming soon to the
            </text>
            <text
              x="41"
              y="31"
              fill="#fff"
              font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="16"
              font-weight="600"
              textLength="78"
              lengthAdjust="spacingAndGlyphs"
            >
              App Store
            </text>
          </svg>
        </li>
        <li>
          <svg
            class="badge"
            viewBox="0 0 135 40"
            role="img"
            aria-label="Coming soon to Google Play"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="135" height="40" rx="7" fill="#000" />
            <rect x="0.5" y="0.5" width="134" height="39" rx="6.5" fill="none" stroke="#a6a6a6" />
            <!-- The four-colour play triangle, drawn as its four facets. -->
            <g transform="translate(11 10.5)">
              <path d="M.4.5A2 2 0 0 0 0 1.9v15.2c0 .6.1 1.1.4 1.4l9-9-9-9z" fill="#00a0ff" />
              <path d="m12.4 12.5-3-3 3-3 3.6 2c1 .6 1 1.5 0 2.1l-3.6 2z" fill="#ffbc00" />
              <path d="M12.4 12.5 9.4 9.5l-9 9c.4.4 1 .4 1.7 0l10.3-6z" fill="#ff3a44" />
              <path d="M12.4 6.5 2.1.6C1.4.2.8.2.4.6l9 9 3-3z" fill="#00de76" />
            </g>
            <text
              x="41"
              y="16.5"
              fill="#fff"
              font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="8"
              textLength="72"
              lengthAdjust="spacingAndGlyphs"
            >
              COMING SOON TO
            </text>
            <text
              x="41"
              y="31"
              fill="#fff"
              font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="16"
              font-weight="600"
              textLength="88"
              lengthAdjust="spacingAndGlyphs"
            >
              Google Play
            </text>
          </svg>
        </li>
      </ul>
    </main>

    <footer class="site-footer">
      <a href="/privacy/">Privacy</a>
      <span>&copy; 2026 Nomkin</span>
    </footer>
  </body>
</html>
