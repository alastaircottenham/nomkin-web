    <!--
      Which language to show, and who gets to decide.

      Three answers, in that order of authority. A language picked from the
      selector at the foot of the page wins, on this visit and on every later
      one: it is the only signal here that is somebody actually saying what they
      want. Failing that, the browser's own list of languages, which is the
      nearest thing to an answer from a reader who has not been asked yet.
      Failing both, English, by doing nothing at all.

      The guessing half runs on the English pages only. `build.mjs` rewrites
      `data-lang` for the rest, and a reader already on `/ja/` has asked, so
      there is nothing left to guess and a page that guessed anyway would be
      arguing with them. `?lang=en` forces English past a browser that says
      otherwise, and is remembered like any other choice.
    -->
    <script data-lang="en">
      (function () {
        /* Language tag to URL prefix. English is the empty one, because English
           lives at the root and every other language hangs off it. */
        var DIRS = { en: '', de: 'de', es: 'es', fr: 'fr', pt: 'pt-br', ja: 'ja', ko: 'ko' };
        var KEY = 'nomkin-lang';
        var here = document.currentScript.getAttribute('data-lang');

        function keep(code) {
          try {
            window.localStorage.setItem(KEY, code);
          } catch (error) {
            /* Private browsing, or storage switched off. The choice still works
               for the page being opened; it just is not there the next time. */
          }
        }

        /* A browser sends `de-AT` or `pt-PT` as readily as `de`, so only the
           first part is looked at. Both Portugueses land on the Brazilian
           translation, which is a great deal nearer either than English is.
           Anything we do not publish returns null, meaning "keep looking". */
        function dirFor(tag) {
          var base = String(tag || '').toLowerCase().split('-')[0];
          return Object.prototype.hasOwnProperty.call(DIRS, base) ? DIRS[base] : null;
        }

        document.addEventListener('click', function (event) {
          var node = event.target;
          var picked = node && node.closest && node.closest('[data-lang-pick]');
          if (picked) keep(picked.getAttribute('data-lang-pick'));
        });

        if (here !== 'en') return;

        var wanted = null;

        var forced = /[?&]lang=([a-z-]+)/i.exec(location.search);
        if (forced) {
          wanted = dirFor(forced[1]);
          if (wanted !== null) keep(forced[1].toLowerCase());
        }

        if (wanted === null) {
          try {
            wanted = dirFor(window.localStorage.getItem(KEY));
          } catch (error) {
            /* As above: unreadable storage is not an answer, so fall through. */
          }
        }

        if (wanted === null) {
          var offered = navigator.languages || [navigator.language];
          for (var i = 0; i < offered.length && wanted === null; i++) {
            wanted = dirFor(offered[i]);
          }
        }

        /* '' is English and null is a language we do not publish. Both stay. */
        if (!wanted) return;

        var search = location.search.replace(/([?&])lang=[a-z-]+&?/i, '$1').replace(/[?&]$/, '');
        location.replace('/' + wanted + location.pathname + search + location.hash);
      })();
    </script>

      Spec §6.1 step 1, on the web. The app's first screen supplies three things
      and stops — the name, one line saying what the app is for, and the animal —

      only additions are the two things a landing page has to say that an app
      does not: it isn't out yet, and here is the policy.
    -->

      <h1 class="wordmark">Nomkin</h1>
      <!--i18n:tagline-->
      <p class="tagline">Making calorie tracking simple and fun.</p>

      <!--i18n:coming-soon-->

      <!--/i18n:coming-soon-->

      <ul class="stores">

          Recreations, not the official artwork, and deliberately not links.
          Both stores only permit their badge to point at a live listing, and
          there isn't one yet. Swap in the official SVGs and add the hrefs on
          launch day — see README.md.
        -->
          <svg
            class="badge"
            viewBox="0 0 135 40"
            role="img"
            aria-label="Coming soon to the Apple App Store"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect width="135" height="40" rx="7" fill="#000" />
            <rect x="0.5" y="0.5" width="134" height="39" rx="6.5" fill="none" stroke="#a6a6a6" />
            <path
              fill="#fff"
              d="M25.6 20.3c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9s-1.8-.9-3-.8c-1.5 0-2.9.9-3.7 2.3-1.6 2.7-.4 6.8 1.1 9 .8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-1.1 2.8-2.2c.9-1.2 1.2-2.4 1.3-2.5-.1 0-2.5-1-2.5-3.7zm-2.3-6.8c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.8 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.8-1.3z"
            />

               machine that has none of these fonts. -->

              x="41"
              y="16.5"
              fill="#fff"
              font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="8"
              textLength="70"
              lengthAdjust="spacingAndGlyphs"
            >
              Coming soon to the
            </text>
            <text
              x="41"
              y="31"
              fill="#fff"
              font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
              font-size="16"
              font-weight="600"
              textLength="78"
              lengthAdjust="spacingAndGlyphs"

              App Store
            </text>
            <!--/i18n:badge-apple-->

        </li>
        <li>
          <svg
            class="badge"
